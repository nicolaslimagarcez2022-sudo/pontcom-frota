<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pont.Com Gás e Água — Controle de Manutenção da Frota</title>

<!-- PWA: permite instalar o app na tela inicial do celular -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#05090f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pont.Com Frota">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" href="assets/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #05090f;
    --surface: #0c1420;
    --surface2: #101b2a;
    --surface3: #162436;
    --border: #223349;
    --text: #eaf1fb;
    --muted: #7e8ea3;
    --amber: #2f8fff;
    --amber-dim: #1c65c4;
    --red: #e85d4d;
    --green: #4caf7d;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  h1,h2,h3,.display{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.03em;}
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:var(--amber);}
  button{font-family:'Inter',sans-serif;cursor:pointer;}
  input,select,textarea{font-family:'Inter',sans-serif;}

  /* ---------- LOGIN ---------- */
  #login-screen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(circle at 20% 20%, rgba(47,143,255,0.09), transparent 40%),
      repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 40px),
      var(--bg);
    padding:24px;
  }
  .login-card{
    width:100%;max-width:380px;background:var(--surface);border:1px solid var(--border);
    border-radius:4px;padding:32px 28px;position:relative;
  }
  .login-card:before{
    content:"";position:absolute;top:-1px;left:20px;right:20px;height:4px;
    background:linear-gradient(90deg,var(--amber),var(--amber-dim));border-radius:0 0 3px 3px;
  }
  .login-eyebrow{color:var(--amber);font-size:12px;letter-spacing:.15em;font-weight:600;margin-bottom:4px;}
  .login-card h1{font-size:26px;margin:0 0 22px 0;line-height:1.15;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;}
  .field input, .field select, .field textarea{
    width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);
    padding:11px 12px;border-radius:3px;font-size:15px;outline:none;transition:border-color .15s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--amber);}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    background:var(--amber);color:#04101f;border:none;font-weight:600;
    padding:12px 18px;border-radius:3px;font-size:14px;letter-spacing:.02em;
    transition:background .15s, transform .05s;
  }
  .btn:hover{background:#5eabff;}
  .btn:active{transform:scale(.98);}
  .btn-block{width:100%;}
  .btn-ghost{
    background:transparent;border:1px solid var(--border);color:var(--text);font-weight:500;
  }
  .btn-ghost:hover{border-color:var(--amber);color:var(--amber);}
  .btn-danger{background:var(--red);color:#2a0d08;}
  .btn-danger:hover{background:#ff7a68;}
  .login-error{color:var(--red);font-size:13px;margin-top:-6px;margin-bottom:12px;min-height:16px;}
  .login-switch{text-align:center;margin-top:16px;font-size:13px;color:var(--muted);}
  .login-switch span{color:var(--amber);cursor:pointer;text-decoration:underline;}
  .user-chip-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
  .user-chip{
    background:var(--surface2);border:1px solid var(--border);border-radius:20px;
    padding:7px 14px;font-size:13px;cursor:pointer;transition:.15s;
  }
  .user-chip:hover{border-color:var(--amber);color:var(--amber);}
  .user-chip.active{background:var(--amber);color:#1a1300;border-color:var(--amber);font-weight:600;}

  /* ---------- APP SHELL ---------- */
  #app{display:none;min-height:100vh;}
  header.topbar{
    background:var(--surface);border-bottom:1px solid var(--border);
    padding:14px 20px;display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:10;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  }
  .brand-mark img{width:100%;height:100%;object-fit:contain;}
  .login-logo{display:block;max-width:220px;width:100%;height:auto;margin:0 auto 18px;}
  .brand h1{font-size:16px;margin:0;line-height:1.1;}
  .brand small{display:block;color:var(--muted);font-size:11px;font-weight:400;text-transform:none;letter-spacing:0;font-family:'Inter';}
  .who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);}
  .who b{color:var(--text);}
  .icon-btn{
    background:var(--surface2);border:1px solid var(--border);color:var(--muted);
    width:32px;height:32px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:15px;
  }
  .icon-btn:hover{color:var(--red);border-color:var(--red);}

  main{max-width:960px;margin:0 auto;padding:20px 16px 60px;}

  .tabs{display:flex;gap:6px;margin-bottom:20px;border-bottom:1px solid var(--border);}
  .tab{
    padding:10px 16px;font-size:13px;font-weight:600;color:var(--muted);
    border-bottom:2px solid transparent;cursor:pointer;text-transform:uppercase;letter-spacing:.04em;
  }
  .tab.active{color:var(--amber);border-color:var(--amber);}

  .panel{display:none;}
  .panel.active{display:block;}

  /* Alert cards (oil due) */
  .alert-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px;}
  .alert-card{
    flex:1 1 220px;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--green);
    border-radius:3px;padding:12px 14px;
  }
  .alert-card.due{border-left-color:var(--red);}
  .alert-card.warn{border-left-color:var(--amber);}
  .alert-card .placa{font-family:'JetBrains Mono';font-weight:700;font-size:15px;letter-spacing:.04em;}
  .alert-card .msg{font-size:12.5px;color:var(--muted);margin-top:4px;}
  .alert-card.due .msg{color:var(--red);}
  .alert-card.warn .msg{color:var(--amber-dim);}

  /* Form card */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:20px;margin-bottom:24px;}
  .card h2{font-size:17px;margin:0 0 16px 0;color:var(--text);display:flex;align-items:center;gap:8px;}
  .card h2:before{content:"";width:4px;height:16px;background:var(--amber);display:inline-block;border-radius:2px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  @media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr;}}

  .segmented{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:4px;overflow:hidden;margin-bottom:16px;}
  .segmented button{
    flex:1;background:transparent;border:none;color:var(--muted);padding:10px 8px;font-size:12.5px;font-weight:600;
    border-right:1px solid var(--border);text-transform:uppercase;letter-spacing:.03em;
  }
  .segmented button:last-child{border-right:none;}
  .segmented button.active{background:var(--amber);color:#1a1300;}

  .hint{font-size:12px;color:var(--muted);margin-top:5px;}
  .form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;}

  /* History */
  .filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:end;}
  .filters .field{margin-bottom:0;min-width:150px;flex:1;}

  .ticket-list{display:flex;flex-direction:column;gap:10px;}
  .ticket{
    background:var(--surface);border:1px solid var(--border);border-radius:4px;
    padding:14px 16px 14px 18px;position:relative;
  }
  .ticket:before{
    content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:2px;background:var(--surface3);
  }
  .ticket.tipo-peca:before{background:#29c5ff;}
  .ticket.tipo-oleo:before{background:var(--amber);}
  .ticket.tipo-gasolina:before{background:var(--green);}
  .ticket-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;}
  .ticket-placa{font-family:'JetBrains Mono';font-weight:700;font-size:16px;letter-spacing:.03em;}
  .ticket-tipo{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;}
  .ticket-meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:6px;}
  .ticket-meta b{color:var(--text);font-family:'JetBrains Mono';font-weight:500;}
  .ticket-desc{margin-top:8px;font-size:14px;}
  .ticket-obs{margin-top:6px;font-size:13px;color:var(--muted);font-style:italic;}
  .ticket-foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:11.5px;color:var(--muted);}
  .ticket-del{background:none;border:none;color:var(--muted);font-size:12px;text-decoration:underline;padding:0;}
  .ticket-del:hover{color:var(--red);}
  .empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
  .empty-state .display{font-size:20px;color:var(--text);margin-bottom:6px;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--surface3);border:1px solid var(--amber);color:var(--text);
    padding:12px 20px;border-radius:4px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;
    z-index:100;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
</style>
</head>

  <main>
    <div class="tabs">
      <div class="tab active" data-tab="novo">Novo registro</div>
      <div class="tab" data-tab="historico">Histórico</div>
      <div class="tab" data-tab="painel">Painel</div>
      <div class="tab" data-tab="admin" id="tab-admin" style="display:none;">Funcionários</div>
    </div>

    <!-- ---- PAINEL (alerts) always visible summary is inside "painel" tab, but quick alerts show above form too ---- -->
    <div id="quick-alerts" class="alert-row"></div>

    <!-- ---- NOVO REGISTRO ---- -->
    <div class="panel active" id="panel-novo">
      <div class="card">
        <h2>Registrar manutenção</h2>

        <div class="segmented" id="tipo-segmented">
          <button data-tipo="peca" class="active">Troca de peça</button>
          <button data-tipo="oleo">Troca de óleo</button>
          <button data-tipo="gasolina">Abastecimento</button>
        </div>

        <div class="grid2">
          <div class="field">
            <label for="f-placa">Placa do veículo</label>
            <input id="f-placa" list="placas-list" type="text" placeholder="ex: ABC1D23" style="text-transform:uppercase" class="mono">
            <datalist id="placas-list"></datalist>
          </div>
          <div class="field">
            <label for="f-data">Data</label>
            <input id="f-data" type="date">
          </div>
        </div>

        <div class="grid2">
          <div class="field">
            <label for="f-km">Km atual do veículo</label>
            <input id="f-km" type="number" inputmode="numeric" placeholder="ex: 24500" class="mono">
          </div>
          <div class="field" id="wrap-peca">
            <label for="f-peca">Peça / item trocado</label>
            <select id="f-peca">
              <option value="">Selecione…</option>
            </select>
          </div>
          <div class="field" id="wrap-peca-outro" style="display:none;">
            <label for="f-peca-outro">Qual peça?</label>
            <input id="f-peca-outro" type="text" placeholder="Descreva a peça">
          </div>
          <div class="field" id="wrap-oleo-prox" style="display:none;">
            <label for="f-oleo-prox">Próxima troca prevista (km)</label>
            <input id="f-oleo-prox" type="number" class="mono">
            <div class="hint">Sugestão automática: km atual + 3.000</div>
          </div>
          <div class="field" id="wrap-gasolina-litros" style="display:none;">
            <label for="f-litros">Litros abastecidos (opcional)</label>
            <input id="f-litros" type="number" step="0.01" class="mono">
          </div>
        </div>

        <div class="field">
          <label for="f-obs">Observações</label>
          <textarea id="f-obs" rows="3" placeholder="Detalhes do serviço, condição da peça, etc."></textarea>
        </div>

        <div class="form-actions">
          <button class="btn btn-ghost" id="clear-form-btn">Limpar</button>
          <button class="btn" id="save-btn">Salvar registro</button>
        </div>
      </div>
    </div>

    <!-- ---- HISTÓRICO ---- -->
    <div class="panel" id="panel-historico">
      <div class="filters">
        <div class="field">
          <label>Placa</label>
          <select id="filter-placa"><option value="">Todas</option></select>
        </div>
        <div class="field">
          <label>Tipo</label>
          <select id="filter-tipo">
            <option value="">Todos</option>
            <option value="peca">Troca de peça</option>
            <option value="oleo">Troca de óleo</option>
            <option value="gasolina">Abastecimento</option>
          </select>
        </div>
        <div class="field">
          <label>Buscar</label>
          <input id="filter-texto" type="text" placeholder="peça, obs, funcionário...">
        </div>
      </div>
      <div class="ticket-list" id="ticket-list"></div>
    </div>

    <!-- ---- PAINEL ---- -->
    <div class="panel" id="panel-painel">
      <div class="card">
        <h2>Situação do óleo por veículo</h2>
        <div id="painel-oleo"></div>
      </div>
      <div class="card">
        <h2>Resumo</h2>
        <div id="painel-resumo" style="font-size:14px;color:var(--muted);"></div>
      </div>
    </div>

    <!-- ---- FUNCIONÁRIOS (ADMIN) ---- -->
    <div class="panel" id="panel-admin">
      <div class="card">
        <h2>Buscar funcionário</h2>
        <div class="field">
          <label for="admin-search">Nome do funcionário</label>
          <input id="admin-search" list="admin-func-list" type="text" placeholder="Digite o nome...">
          <datalist id="admin-func-list"></datalist>
        </div>
      </div>
      <div id="admin-summary"></div>
      <div class="ticket-list" id="admin-ticket-list"></div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const PECAS = [
    "Caixa de direção","Botão de partida","Retrovisor","Lâmpada","Bucha da coroa",
    "Rolamento","Relação","Pneu traseiro","Pneu dianteiro","Pastilha de freio dianteira",
    "Lona de freio traseira","Cabo de embreagem","Cabo de acelerador","Outro"
  ];
  const OLEO_INTERVALO = 3000;

  let currentUser = null;
  let currentIsAdmin = false;
  let pendingLoginName = null;
  let creatingUser = false;
  let records = [];
  let users = [];

  const $ = (id) => document.getElementById(id);
  const todayISO = () => new Date().toISOString().slice(0,10);

  function showToast(msg){
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 2200);
  }

  // ---------------- STORAGE (via servidor) ----------------
  const API_BASE = '/api';

  async function loadUsers(){
    try{
      const r = await fetch(API_BASE + '/users');
      users = r.ok ? await r.json() : [];
    }catch(e){ users = []; showToast('Não foi possível conectar ao servidor.'); }
  }
  async function loadRecords(){
    try{
      const r = await fetch(API_BASE + '/records');
      records = r.ok ? await r.json() : [];
    }catch(e){ records = []; showToast('Não foi possível carregar os registros do servidor.'); }
  }

  // ---------------- LOGIN ----------------
  function renderUserChips(){
    const wrap = $('user-chip-list');
    wrap.innerHTML = '';
    if(users.length === 0){
      wrap.style.display = 'none';
      return;
    }
    wrap.style.display = 'flex';
    users.forEach(u=>{
      const chip = document.createElement('div');
      chip.className = 'user-chip' + (pendingLoginName === u.name ? ' active' : '');
      chip.textContent = u.name;
      chip.onclick = () => {
        pendingLoginName = u.name;
        creatingUser = false;
        $('login-name').value = u.name;
        $('login-pin').value = '';
        $('login-pin').focus();
        $('login-title').textContent = 'Entrar';
        $('login-btn').textContent = 'Entrar';
        $('login-switch').innerHTML = 'Novo por aqui? <span id="go-create">Criar usuário</span>';
        bindCreateSwitch();
        renderUserChips();
      };
      wrap.appendChild(chip);
    });
  }

  function bindCreateSwitch(){
    const el = $('go-create');
    if(el) el.onclick = () => {
      creatingUser = true;
      pendingLoginName = null;
      $('login-name').value = '';
      $('login-pin').value = '';
      $('login-title').textContent = 'Criar usuário';
      $('login-btn').textContent = 'Criar e entrar';
      $('login-error').textContent = '';
      $('login-switch').innerHTML = 'Já tem cadastro? <span id="go-login">Voltar para entrar</span>';
      const back = $('go-login');
      if(back) back.onclick = () => {
        creatingUser = false;
        $('login-title').textContent = 'Entrar';
        $('login-btn').textContent = 'Entrar';
        $('login-switch').innerHTML = 'Novo por aqui? <span id="go-create">Criar usuário</span>';
        bindCreateSwitch();
      };
      $('login-name').focus();
    };
  }

  async function handleLogin(){
    const name = $('login-name').value.trim();
    const pin = $('login-pin').value.trim();
    const err = $('login-error');
    err.textContent = '';

    if(!name){ err.textContent = 'Digite seu nome.'; return; }
    if(!/^\d{4}$/.test(pin)){ err.textContent = 'O PIN deve ter 4 números.'; return; }

    try{
      if(creatingUser){
        const resp = await fetch(API_BASE + '/register', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({name, pin})
        });
        const data = await resp.json();
        if(!resp.ok || !data.ok){ err.textContent = data.error || 'Erro ao criar usuário.'; return; }
        currentUser = data.name;
        currentIsAdmin = !!data.isAdmin;
        await loadUsers();
        enterApp();
        return;
      }

      const resp = await fetch(API_BASE + '/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({name, pin})
      });
      const data = await resp.json();
      if(!resp.ok || !data.ok){ err.textContent = data.error || 'Erro ao entrar.'; return; }
      currentUser = data.name;
      currentIsAdmin = !!data.isAdmin;
      enterApp();
    }catch(e){
      err.textContent = 'Não foi possível conectar ao servidor.';
    }
  }

  function enterApp(){
    $('login-screen').style.display = 'none';
    $('app').style.display = 'block';
    $('who-name').textContent = currentUser;
    $('f-data').value = todayISO();
    $('tab-admin').style.display = currentIsAdmin ? '' : 'none';
    renderAll();
  }

  function logout(){
    currentUser = null;
    currentIsAdmin = false;
    pendingLoginName = null;
    creatingUser = false;
    $('login-pin').value = '';
    $('login-error').textContent = '';
    $('app').style.display = 'none';
    $('login-screen').style.display = 'flex';
    renderUserChips();
  }

  // ---------------- FORM ----------------
  let tipoAtual = 'peca';

  function setupPecaSelect(){
    const sel = $('f-peca');
    PECAS.forEach(p=>{
      const opt = document.createElement('option');
      opt.value = p; opt.textContent = p;
      sel.appendChild(opt);
    });
  }

  function setTipo(tipo){
    tipoAtual = tipo;
    document.querySelectorAll('#tipo-segmented button').forEach(b=>{
      b.classList.toggle('active', b.dataset.tipo === tipo);
    });
    $('wrap-peca').style.display = tipo === 'peca' ? 'block' : 'none';
    $('wrap-peca-outro').style.display = 'none';
    $('wrap-oleo-prox').style.display = tipo === 'oleo' ? 'block' : 'none';
    $('wrap-gasolina-litros').style.display = tipo === 'gasolina' ? 'block' : 'none';
    if(tipo === 'oleo') suggestOleoProx();
  }

  function suggestOleoProx(){
    const km = parseInt($('f-km').value, 10);
    if(!isNaN(km)) $('f-oleo-prox').value = km + OLEO_INTERVALO;
  }

  function clearForm(){
    $('f-placa').value = '';
    $('f-km').value = '';
    $('f-peca').value = '';
    $('f-peca-outro').value = '';
    $('f-oleo-prox').value = '';
    $('f-litros').value = '';
    $('f-obs').value = '';
    $('f-data').value = todayISO();
    setTipo('peca');
  }

  async function saveRecord(){
    const placa = $('f-placa').value.trim().toUpperCase();
    const data = $('f-data').value;
    const km = parseInt($('f-km').value, 10);

    if(!placa){ showToast('Informe a placa do veículo.'); return; }
    if(!data){ showToast('Informe a data.'); return; }
    if(isNaN(km)){ showToast('Informe a quilometragem.'); return; }

    let descricao = '';
    let extra = {};

    if(tipoAtual === 'peca'){
      let peca = $('f-peca').value;
      if(!peca){ showToast('Selecione a peça trocada.'); return; }
      if(peca === 'Outro'){
        const outro = $('f-peca-outro').value.trim();
        if(!outro){ showToast('Descreva a peça.'); return; }
        peca = outro;
      }
      descricao = peca;
    } else if(tipoAtual === 'oleo'){
      descricao = 'Troca de óleo';
      const prox = parseInt($('f-oleo-prox').value, 10);
      extra.proximaTrocaKm = isNaN(prox) ? (km + OLEO_INTERVALO) : prox;
    } else if(tipoAtual === 'gasolina'){
      descricao = 'Abastecimento';
      const litros = parseFloat($('f-litros').value);
      if(!isNaN(litros)) extra.litros = litros;
    }

    const rec = {
      tipo: tipoAtual,
      placa, data, km, descricao,
      obs: $('f-obs').value.trim(),
      usuario: currentUser,
      ...extra
    };

    try{
      const resp = await fetch(API_BASE + '/records', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(rec)
      });
      if(!resp.ok) throw new Error('Falha ao salvar');
      const saved = await resp.json();
      records.push(saved);
      showToast('Registro salvo com sucesso.');
      clearForm();
      renderAll();
    }catch(e){
      showToast('Erro ao salvar registro no servidor.');
    }
  }

  // ---------------- HISTÓRICO ----------------
  function tipoLabel(t){
    return t === 'peca' ? 'Peça' : t === 'oleo' ? 'Óleo' : 'Combustível';
  }

  function myRecords(){
    return records.filter(r => r.usuario === currentUser);
  }

  function renderPlacaOptions(){
    const placas = [...new Set(myRecords().map(r=>r.placa))].sort();
    const dl = $('placas-list');
    dl.innerHTML = '';
    placas.forEach(p=>{
      const opt = document.createElement('option'); opt.value = p; dl.appendChild(opt);
    });
    const filt = $('filter-placa');
    const prevVal = filt.value;
    filt.innerHTML = '<option value="">Todas</option>';
    placas.forEach(p=>{
      const opt = document.createElement('option'); opt.value = p; opt.textContent = p; filt.appendChild(opt);
    });
    filt.value = prevVal;
  }

  async function deleteRecord(id){
    try{
      const resp = await fetch(API_BASE + '/records/' + encodeURIComponent(id), { method: 'DELETE' });
      if(!resp.ok) throw new Error('Falha ao excluir');
      records = records.filter(r=>r.id !== id);
      renderAll();
      showToast('Registro removido.');
    }catch(e){
      showToast('Erro ao remover registro no servidor.');
    }
  }

  function renderTickets(){
    const list = $('ticket-list');
    const fPlaca = $('filter-placa').value;
    const fTipo = $('filter-tipo').value;
    const fTexto = $('filter-texto').value.trim().toLowerCase();

    let filtered = myRecords().filter(r=>{
      if(fPlaca && r.placa !== fPlaca) return false;
      if(fTipo && r.tipo !== fTipo) return false;
      if(fTexto){
        const blob = (r.descricao+' '+r.obs+' '+r.usuario+' '+r.placa).toLowerCase();
        if(!blob.includes(fTexto)) return false;
      }
      return true;
    });
    filtered.sort((a,b)=> (b.data+b.criadoEm).localeCompare(a.data+a.criadoEm));

    list.innerHTML = '';
    if(filtered.length === 0){
      list.innerHTML = '<div class="empty-state"><div class="display">Nenhum registro</div>Ajuste os filtros ou cadastre uma nova manutenção.</div>';
      return;
    }

    filtered.forEach(r=>{
      const div = document.createElement('div');
      div.className = 'ticket tipo-' + r.tipo;
      let extraLine = '';
      if(r.tipo === 'oleo' && r.proximaTrocaKm) extraLine = `<div class="ticket-meta">Próxima troca em: <b>${r.proximaTrocaKm.toLocaleString('pt-BR')} km</b></div>`;
      if(r.tipo === 'gasolina' && r.litros) extraLine = `<div class="ticket-meta">Litros: <b>${r.litros}</b></div>`;
      div.innerHTML = `
        <div class="ticket-top">
          <div>
            <span class="ticket-placa">${r.placa}</span>
            <div class="ticket-tipo">${tipoLabel(r.tipo)}</div>
          </div>
          <div class="ticket-meta"><b>${r.km.toLocaleString('pt-BR')} km</b> · ${formatDate(r.data)}</div>
        </div>
        <div class="ticket-desc">${escapeHtml(r.descricao)}</div>
        ${r.obs ? `<div class="ticket-obs">"${escapeHtml(r.obs)}"</div>` : ''}
        ${extraLine}
        <div class="ticket-foot">
          <span>Registrado por ${escapeHtml(r.usuario)}</span>
          <button class="ticket-del" data-id="${r.id}">excluir</button>
        </div>
      `;
      list.appendChild(div);
    });

    list.querySelectorAll('.ticket-del').forEach(btn=>{
      btn.onclick = () => {
        if(confirm('Excluir este registro?')) deleteRecord(btn.dataset.id);
      };
    });
  }

  function formatDate(iso){
    if(!iso) return '';
    const [y,m,d] = iso.split('-');
    return `${d}/${m}/${y}`;
  }
  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---------------- PAINEL / ALERTAS DE ÓLEO ----------------
  function oleoStatusPorPlaca(){
    const meus = myRecords();
    const placas = [...new Set(meus.map(r=>r.placa))];
    return placas.map(placa=>{
      const regsMoto = meus.filter(r=>r.placa===placa);
      const maxKm = Math.max(...regsMoto.map(r=>r.km));
      const trocasOleo = regsMoto.filter(r=>r.tipo==='oleo').sort((a,b)=> b.km - a.km);
      const ultimaTroca = trocasOleo[0];
      let status = 'ok', faltam = null, proxima = null;
      if(!ultimaTroca){
        status = 'sem-registro';
      } else {
        proxima = ultimaTroca.proximaTrocaKm || (ultimaTroca.km + OLEO_INTERVALO);
        faltam = proxima - maxKm;
        if(faltam <= 0) status = 'due';
        else if(faltam <= 500) status = 'warn';
        else status = 'ok';
      }
      return {placa, maxKm, ultimaTroca, proxima, faltam, status};
    }).sort((a,b)=>{
      const order = {due:0, 'sem-registro':1, warn:2, ok:3};
      return order[a.status]-order[b.status];
    });
  }

  function renderAlerts(){
    const data = oleoStatusPorPlaca();
    const wrap = $('quick-alerts');
    wrap.innerHTML = '';
    const relevant = data.filter(d=> d.status==='due' || d.status==='warn').slice(0,6);
    relevant.forEach(d=>{
      const div = document.createElement('div');
      div.className = 'alert-card ' + (d.status==='due' ? 'due' : 'warn');
      const msg = d.status==='due'
        ? `Óleo vencido há ${Math.abs(d.faltam).toLocaleString('pt-BR')} km`
        : `Faltam ${d.faltam.toLocaleString('pt-BR')} km para troca de óleo`;
      div.innerHTML = `<div class="placa">${d.placa}</div><div class="msg">${msg}</div>`;
      wrap.appendChild(div);
    });
  }

  function renderPainel(){
    const data = oleoStatusPorPlaca();
    const wrap = $('painel-oleo');
    wrap.innerHTML = '';
    if(data.length===0){
      wrap.innerHTML = '<div class="empty-state">Nenhum veículo cadastrado ainda.</div>';
    } else {
      data.forEach(d=>{
        const div = document.createElement('div');
        div.className = 'alert-card ' + (d.status==='due' ? 'due' : d.status==='warn' ? 'warn' : '');
        div.style.marginBottom = '8px';
        let msg;
        if(d.status==='sem-registro') msg = 'Nenhuma troca de óleo registrada';
        else if(d.status==='due') msg = `Vencido há ${Math.abs(d.faltam).toLocaleString('pt-BR')} km (troca aos ${d.proxima.toLocaleString('pt-BR')} km)`;
        else msg = `Próxima troca aos ${d.proxima.toLocaleString('pt-BR')} km (faltam ${d.faltam.toLocaleString('pt-BR')} km)`;
        div.innerHTML = `<div class="placa">${d.placa} <span style="color:var(--muted);font-weight:400;font-size:12px;">· ${d.maxKm.toLocaleString('pt-BR')} km atual</span></div><div class="msg">${msg}</div>`;
        wrap.appendChild(div);
      });
    }

    const meus = myRecords();
    const totalMotos = new Set(meus.map(r=>r.placa)).size;
    const totalPecas = meus.filter(r=>r.tipo==='peca').length;
    const totalOleo = meus.filter(r=>r.tipo==='oleo').length;
    const totalGas = meus.filter(r=>r.tipo==='gasolina').length;
    $('painel-resumo').innerHTML = `
      Veículos cadastrados: <b style="color:var(--text)">${totalMotos}</b><br>
      Peças trocadas (total): <b style="color:var(--text)">${totalPecas}</b><br>
      Trocas de óleo registradas: <b style="color:var(--text)">${totalOleo}</b><br>
      Abastecimentos registrados: <b style="color:var(--text)">${totalGas}</b>
    `;
  }

  function renderAll(){
    renderPlacaOptions();
    renderTickets();
    renderAlerts();
    renderPainel();
    if(currentIsAdmin) renderAdmin();
  }

  // ---------------- FUNCIONÁRIOS (ADMIN) ----------------
  let adminExpanded = new Set();

  function distinctFuncionarios(){
    const doRegistros = records.map(r => r.usuario).filter(Boolean);
    const doCadastro = users.map(u => u.name);
    return [...new Set([...doCadastro, ...doRegistros])].sort((a,b)=> a.localeCompare(b));
  }

  function renderAdminFuncList(){
    const dl = $('admin-func-list');
    dl.innerHTML = '';
    distinctFuncionarios().forEach(nome=>{
      const opt = document.createElement('option');
      opt.value = nome;
      dl.appendChild(opt);
    });
  }

  function renderTicketHtml(r){
    let extraLine = '';
    if(r.tipo === 'oleo' && r.proximaTrocaKm) extraLine = `<div class="ticket-meta">Próxima troca em: <b>${r.proximaTrocaKm.toLocaleString('pt-BR')} km</b></div>`;
    if(r.tipo === 'gasolina' && r.litros) extraLine = `<div class="ticket-meta">Litros: <b>${r.litros}</b></div>`;
    return `
      <div class="ticket-top">
        <div>
          <span class="ticket-placa">${escapeHtml(r.placa)}</span>
          <div class="ticket-tipo">${tipoLabel(r.tipo)}</div>
        </div>
        <div class="ticket-meta"><b>${r.km.toLocaleString('pt-BR')} km</b> · ${formatDate(r.data)}</div>
      </div>
      <div class="ticket-desc">${escapeHtml(r.descricao)}</div>
      ${r.obs ? `<div class="ticket-obs">"${escapeHtml(r.obs)}"</div>` : ''}
      ${extraLine}
    `;
  }

  async function excluirUsuario(nome){
    if(nome === currentUser){
      showToast('Você não pode excluir a conta com a qual está logado.');
      return;
    }
    const chave = window.prompt(`Pra excluir o usuário "${nome}", digite a chave de admin (ADMIN_SETUP_KEY) configurada no servidor:`);
    if(chave === null) return;
    if(!chave.trim()){ showToast('Chave não informada.'); return; }
    if(!confirm(`Confirma excluir o usuário "${nome}"? O histórico dele continua salvo, mas ele não vai mais conseguir entrar.`)) return;

    try{
      const resp = await fetch(API_BASE + '/admin/users/' + encodeURIComponent(nome), {
        method: 'DELETE',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ setupKey: chave.trim() })
      });
      const data = await resp.json();
      if(!resp.ok || !data.ok){ showToast(data.error || 'Erro ao excluir usuário.'); return; }
      showToast('Usuário excluído.');
      adminExpanded.delete(nome);
      await loadUsers();
      renderAdmin();
    }catch(e){
      showToast('Não foi possível conectar ao servidor.');
    }
  }

  function renderAdmin(){
    renderAdminFuncList();
    const termo = $('admin-search').value.trim().toLowerCase();
    const summaryEl = $('admin-summary');
    const listEl = $('admin-ticket-list');

    const nomes = distinctFuncionarios().filter(n => !termo || n.toLowerCase().includes(termo));

    if(nomes.length === 0){
      summaryEl.innerHTML = '';
      listEl.innerHTML = '<div class="empty-state"><div class="display">Nada encontrado</div>Nenhum funcionário com esse nome.</div>';
      return;
    }

    const linhas = nomes.map(nome=>{
      const doFunc = records.filter(r => r.usuario === nome);
      const placas = new Set(doFunc.map(r=>r.placa));
      const ordenados = [...doFunc].sort((a,b)=> (b.data+b.criadoEm).localeCompare(a.data+a.criadoEm));
      const ultimo = ordenados[0] || null;
      return { nome, total: doFunc.length, veiculos: placas.size, ultimo, ordenados };
    }).sort((a,b)=>{
      if(!a.ultimo && !b.ultimo) return a.nome.localeCompare(b.nome);
      if(!a.ultimo) return 1;
      if(!b.ultimo) return -1;
      return (b.ultimo.data+b.ultimo.criadoEm).localeCompare(a.ultimo.data+a.ultimo.criadoEm);
    });

    summaryEl.innerHTML = `
      <div class="card">
        <h2>Funcionários</h2>
        <div style="font-size:14px;color:var(--muted);">
          ${nomes.length} funcionário${nomes.length===1?'':'s'} · ${records.length} registro${records.length===1?'':'s'} no total · clique num nome para ver o histórico
        </div>
      </div>
    `;

    listEl.innerHTML = '';
    linhas.forEach(l=>{
      const aberto = adminExpanded.has(l.nome);

      const card = document.createElement('div');
      card.className = 'ticket';

      const head = document.createElement('div');
      head.style.cursor = 'pointer';
      head.innerHTML = `
        <div class="ticket-top">
          <div>
            <span class="ticket-placa">${aberto ? '▾' : '▸'} ${escapeHtml(l.nome)}</span>
            <div class="ticket-tipo">${l.total} registro${l.total===1?'':'s'} · ${l.veiculos} veículo${l.veiculos===1?'':'s'}</div>
          </div>
          <div class="ticket-meta">${l.ultimo ? formatDate(l.ultimo.data) : 'sem registros'}</div>
        </div>
        ${(!aberto && l.ultimo) ? `<div class="ticket-desc">Último: ${escapeHtml(l.ultimo.placa)} · ${tipoLabel(l.ultimo.tipo)} — ${escapeHtml(l.ultimo.descricao)}</div>` : ''}
      `;
      head.addEventListener('click', ()=>{
        if(adminExpanded.has(l.nome)) adminExpanded.delete(l.nome);
        else adminExpanded.add(l.nome);
        renderAdmin();
      });
      card.appendChild(head);

      if(aberto){
        const historico = document.createElement('div');
        historico.style.marginTop = '12px';
        historico.style.paddingTop = '12px';
        historico.style.borderTop = '1px solid var(--border)';
        historico.style.display = 'flex';
        historico.style.flexDirection = 'column';
        historico.style.gap = '10px';

        const temConta = users.some(u => u.name === l.nome);
        if(temConta){
          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'btn btn-danger';
          delBtn.style.alignSelf = 'flex-start';
          delBtn.textContent = 'Excluir usuário';
          delBtn.addEventListener('click', (ev)=>{
            ev.stopPropagation();
            excluirUsuario(l.nome);
          });
          historico.appendChild(delBtn);
        }

        if(l.ordenados.length === 0){
          historico.innerHTML = '<div style="color:var(--muted);font-size:13px;">Nenhum registro ainda.</div>';
        } else {
          l.ordenados.forEach(r=>{
            const item = document.createElement('div');
            item.style.background = 'var(--surface2)';
            item.style.border = '1px solid var(--border)';
            item.style.borderRadius = '4px';
            item.style.padding = '10px 12px';
            item.innerHTML = renderTicketHtml(r);
            historico.appendChild(item);
          });
        }
        card.appendChild(historico);
      }

      listEl.appendChild(card);
    });
  }

  // ---------------- TABS ----------------
  function setupTabs(){
    document.querySelectorAll('.tab').forEach(tab=>{
      tab.onclick = () => {
        document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
        tab.classList.add('active');
        $('panel-' + tab.dataset.tab).classList.add('active');
      };
    });
  }

  // ---------------- INIT ----------------
  async function init(){
    setupPecaSelect();
    setupTabs();
    bindCreateSwitch();

    $('f-peca').onchange = () => {
      $('wrap-peca-outro').style.display = $('f-peca').value === 'Outro' ? 'block' : 'none';
    };
    $('f-km').addEventListener('input', () => { if(tipoAtual === 'oleo') suggestOleoProx(); });
    document.querySelectorAll('#tipo-segmented button').forEach(b=>{
      b.onclick = () => setTipo(b.dataset.tipo);
    });
    $('clear-form-btn').onclick = clearForm;
    $('save-btn').onclick = saveRecord;
    $('login-btn').onclick = handleLogin;
    $('login-pin').addEventListener('keydown', e => { if(e.key==='Enter') handleLogin(); });
    $('logout-btn').onclick = logout;
    ['filter-placa','filter-tipo','filter-texto'].forEach(id=>{
      $(id).addEventListener('input', renderTickets);
      $(id).addEventListener('change', renderTickets);
    });
    $('admin-search').addEventListener('input', renderAdmin);

    await loadUsers();
    await loadRecords();
    renderUserChips();

    // Registra o service worker (permite instalar o app na tela inicial)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  }

  init();
})();
</script>
</body>
